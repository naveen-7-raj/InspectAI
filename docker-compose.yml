services:
  # ============================================================================
  # InspectAI Prediction & WebSocket Streaming Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectai_backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - DEVICE=cpu
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # InspectAI Streamlit Monitoring Dashboard
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectai_frontend
    restart: unless-stopped
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - STREAMLIT_HOST=0.0.0.0
      - STREAMLIT_PORT=8501
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

networks:
  default:
    name: inspectai_network

