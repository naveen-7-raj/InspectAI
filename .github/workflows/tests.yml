name: InspectAI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      # ------------------------------------------------------------------------
      # Stage 1: Data-Independent Core Unit Tests
      # Verifies 1D CNN architecture, digital signal conditioning, sliding window
      # mathematics, repository structure, and configuration parsing without
      # requiring external CWRU .mat binaries or trained model weights.
      # ------------------------------------------------------------------------
      - name: Run Data-Independent Core Unit Tests
        run: |
          pytest tests/test_cnn_1d.py tests/test_preprocessing.py tests/test_windowing.py tests/test_structure.py -v

      # ------------------------------------------------------------------------
      # Stage 2: Full Integration Suite
      # Note: The full 140-test suite covers end-to-end FastAPI inference,
      # WebSocket CWRU replay, and final holdout evaluation. In production CI,
      # this requires either caching data/raw/cwru or executing the automated
      # reproduction pipeline (python src/ingestion/download_cwru.py).
      # ------------------------------------------------------------------------
      - name: Run Complete Test Suite
        run: |
          # If raw CWRU files are present or hydrated, execute all 140 tests
          if [ -d "data/raw/cwru" ] && [ "$(ls -A data/raw/cwru/*.mat 2>/dev/null)" ]; then
            echo "Authentic CWRU dataset detected. Executing full 140-test suite..."
            pytest tests/ -v
          else
            echo "Notice: Raw CWRU .mat binaries are excluded from Git via .gitignore."
            echo "Running all offline-capable unit test modules..."
            pytest tests/test_cnn_1d.py tests/test_preprocessing.py tests/test_windowing.py tests/test_structure.py -v
          fi
